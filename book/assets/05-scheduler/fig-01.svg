<g id="o2:1" transform="translate(0, 0)"><rect x="0" y="0" width="1200" height="660" fill="#fafbfd" stroke="#dee0e3" stroke-width="1" rx="16" ry="16"/></g>
<g id="a2:1" transform="translate(40, 25.058)"><text font-size="28" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="bold" fill="#1f2329" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="32.942"><tspan x="0" text-anchor="start">调度器里没有 prefill 阶段和 decode 阶段，只有 num_computed_tokens 追 num_tokens</tspan></tspan></text></g>
<g id="a2:2" transform="translate(40, 75.529)"><text font-size="14" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="16.471"><tspan x="0" text-anchor="start">每一步给每条请求分 num_new_tokens = num_tokens_with_spec − num_computed_tokens（再被预算截断）；decode 是差 1，prefill 是差一整段 prompt</tspan></tspan></text></g>
<g id="a2:3" transform="translate(40, 621.882)"><text font-size="12" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="14.118"><tspan x="0" text-anchor="start">来源：vllm/v1/core/sched/scheduler.py:701-710 NOTE(woosuk)、839-848；05-scheduler/sim_scheduler.py 默认场景 unified</tspan></tspan></text></g>
<g id="a2:4" transform="translate(40, 134.7055)"><text font-size="13" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#1f2329" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="15.295"><tspan x="0" text-anchor="start">把每条请求画成一根“token 尺子”：深色 = 已经算过（有 KV），浅色 = 还没算，橙色 = 本步要算的那一段</tspan></tspan></text></g>
