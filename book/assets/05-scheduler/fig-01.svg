<g id="a2:16" transform="translate(990, 404.47025)"><text font-size="11.5" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="end" dominant-baseline="alphabetic" x="106"><tspan x="106" y="13.53"><tspan x="-1.36" text-anchor="start">num_tokens = 5,000</tspan></tspan></text></g>
<g id="o2:14" transform="translate(40, 432)"><rect x="0" y="0" width="1120" height="150" fill="#f5f6f7" stroke="#dee0e3" stroke-width="1" rx="8" ry="8"/></g>
<g id="a2:17" transform="translate(60, 447.29376)"><text font-size="12.5" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#1f2329" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="14.706"><tspan x="0" text-anchor="start">num_new_tokens = num_tokens_with_spec + num_output_placeholders − num_computed_tokens # 839-843</tspan></tspan></text></g>
<g id="a2:18" transform="translate(60, 471.29376)"><text font-size="12.5" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#1f2329" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="14.706"><tspan x="0" text-anchor="start">num_new_tokens = min(num_new_tokens, long_prefill_threshold, token_budget, input_budget − draft_slots)</tspan></tspan></text></g>
<g id="a2:19" transform="translate(60, 495.29376)"><text font-size="12.5" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#1f2329" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="14.706"><tspan x="0" text-anchor="start">num_new_tokens = min(num_new_tokens, max_model_len − num_computed_tokens − 1) # 852-857</tspan></tspan></text></g>
<g id="a2:20" transform="translate(60, 525.882)"><text font-size="12" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#1f2329" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="14.118"><tspan x="0" text-anchor="start">同一个公式覆盖 decode（差 1）、chunked prefill（差剩余 prompt）、投机解码（差 1 + k）、抢占后恢复（差 prompt + 已生成）、前缀命中（computed 起点不是 0）。</tspan></tspan></text></g>
<g id="a2:21" transform="translate(60, 547.882)"><text font-size="12" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="14.118"><tspan x="0" text-anchor="start">第 2 步 R2 只拿到 2046，差 2 个到 2048：R0、R1 先排（running 优先），各占 1 个预算。</tspan></tspan></text></g>
