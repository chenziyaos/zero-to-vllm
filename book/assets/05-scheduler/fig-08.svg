<g id="a2:39" transform="translate(40, 625.882)"><text font-size="12" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#1f2329" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="14.118"><tspan x="0" text-anchor="start">两边总耗时打平是两笔账恰好抵消：vLLM 前向的 token 里 17% 是重算；SGLang 的 prefill 单独成批，多跑了 19% 的步数，每步都要把权重和 KV 再读一遍。</tspan></tspan></text></g>
<g id="a2:40" transform="translate(40, 647.882)"><text font-size="12" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="14.118"><tspan x="0" text-anchor="start">--watermark 0.05 把抢占从 182 压到 7、耗时 116.0 → 109.4 s；SGLang 调低 conservativeness 到 0.3 是 114.7 s。两边的旋钮在调同一件事：给 decode 留多少余量。</tspan></tspan></text></g>
</svg>