<g id="a1:30" transform="translate(120, 545.882)"><text font-size="12" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#1f2329" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="14.118"><tspan x="0" text-anchor="start">201–203 步：R0–R2 完成腾出块，R3–R7 依次恢复，每条都要重新 prefill「prompt + 已生成」：R3 一次排 254 = 100 + 154。</tspan></tspan></text></g>
<g id="a1:31" transform="translate(120, 567.882)"><text font-size="12" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#1f2329" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="14.118"><tspan x="0" text-anchor="start">R7 是最后进来的，在 FCFS 下永远是队尾，被抢 3 次。合计 7 次抢占、重算 1,209 token：前向 3,601 个 token 里只有 2,400 个是必要的。</tspan></tspan></text></g>
<g id="a1:32" transform="translate(120, 589.882)"><text font-size="12" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="14.118"><tspan x="0" text-anchor="start">30–200 步 wait 只增不减：抢占那一步 waiting 循环整轮跳过（1050 行）；它释放的块随即被其余请求的 decode 陆续用掉，队首（就是它）整条序列始终放不下，只能等 R0–R2 完成。</tspan></tspan></text></g>
</svg>