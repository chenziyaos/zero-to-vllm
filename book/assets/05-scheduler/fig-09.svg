<svg xmlns="http://www.w3.org/2000/svg"
     width="1240"
     height="680"
     viewBox="-20 -20 1240 680">
<g id="o2:1" transform="translate(0, 0)"><rect x="0" y="0" width="1200" height="640" fill="#fafbfd" stroke="#dee0e3" stroke-width="1" rx="16" ry="16"/></g>
<g id="a2:1" transform="translate(40, 25.058)"><text font-size="28" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="bold" fill="#1f2329" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="32.942"><tspan x="0" text-anchor="start">从 Orca 到 V1：调度单位从“请求”变成“迭代”，再变成“token”</tspan></tspan></text></g>
<g id="a2:2" transform="translate(40, 75.529)"><text font-size="14" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="16.471"><tspan x="0" text-anchor="start">每一代都在解决上一代留下的空泡：Orca 消灭了等整批结束，Sarathi 消灭了长 prefill 卡住 decode，V1 把 prefill/decode 两套逻辑合成一个公式</tspan></tspan></text></g>
<g id="a2:3" transform="translate(40, 601.882)"><text font-size="12" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="14.118"><tspan x="0" text-anchor="start">来源：Orca OSDI 2022；PagedAttention SOSP 2023；SARATHI 2023 / Sarathi-Serve OSDI 2024；DeepSpeed-FastGen 2024；vLLM Blog 2025-01-27（V1）</tspan></tspan></text></g>
<g id="o2:2" transform="translate(40, 170)"><rect x="0" y="0" width="208" height="200" fill="#f5f6f7" stroke="#dee0e3" stroke-width="1" rx="12" ry="12"/></g>
<g id="a2:4" transform="translate(56, 181.176)"><text font-size="16" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="bold" fill="#1f2329" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="18.824"><tspan x="0" text-anchor="start">静态批（2022 前）</tspan></tspan></text></g>
<g id="a2:5" transform="translate(56, 213.882)"><text font-size="12" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="14.118"><tspan x="0" text-anchor="start">整批一起进、一起出</tspan></tspan></text></g>
<g id="a2:6" transform="translate(56, 234.882)"><text font-size="12" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="14.118"><tspan x="0" text-anchor="start">短请求等长请求</tspan></tspan></text></g>
<g id="a2:7" transform="translate(56, 255.882)"><text font-size="12" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="14.118"><tspan x="0" text-anchor="start">padding 浪费算力</tspan></tspan></text></g>
<g id="c2:1" transform="translate(250, 270)"><path fill="none" stroke="#dee0e3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M 0 0 L 16 0"/></g>
<g id="d2:1" transform="translate(253.5, 261.5)"><defs><symbol id="svgicon-d2-1" viewBox="0 0 15 17"><g transform="translate(-253.5 -261.5)"><polygon points="256,264 266,270 256,276" fill="#DEE0E3" /></g></symbol></defs><use href="#svgicon-d2-1" x="0" y="0" width="15" height="17"/></g>
<g id="o2:3" transform="translate(268, 170)"><rect x="0" y="0" width="208" height="200" fill="#e1eaff" stroke="#82a7fc" stroke-width="1" rx="12" ry="12"/></g>
<g id="a2:8" transform="translate(284, 181.176)"><text font-size="16" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="bold" fill="#1f2329" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="18.824"><tspan x="0" text-anchor="start">Orca（OSDI 22）</tspan></tspan></text></g>
<g id="a2:9" transform="translate(284, 213.882)"><text font-size="12" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="14.118"><tspan x="0" text-anchor="start">iteration-level scheduling</tspan></tspan></text></g>
<g id="a2:10" transform="translate(284, 234.882)"><text font-size="12" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="14.118"><tspan x="0" text-anchor="start">每步重新选 batch</tspan></tspan></text></g>
<g id="a2:11" transform="translate(284, 255.882)"><text font-size="12" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="14.118"><tspan x="0" text-anchor="start">selective batching</tspan></tspan></text></g>
<g id="a2:12" transform="translate(284, 276.882)"><text font-size="12" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="14.118"><tspan x="0" text-anchor="start">attention 按请求拆开算</tspan></tspan></text></g>
<g id="c2:2" transform="translate(478, 270)"><path fill="none" stroke="#dee0e3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M 0 0 L 16 0"/></g>
<g id="d2:2" transform="translate(481.5, 261.5)"><defs><symbol id="svgicon-d2-2" viewBox="0 0 15 17"><g transform="translate(-481.5 -261.5)"><polygon points="484,264 494,270 484,276" fill="#DEE0E3" /></g></symbol></defs><use href="#svgicon-d2-2" x="0" y="0" width="15" height="17"/></g>
<g id="o2:4" transform="translate(496, 170)"><rect x="0" y="0" width="208" height="200" fill="#e1eaff" stroke="#82a7fc" stroke-width="1" rx="12" ry="12"/></g>
<g id="a2:13" transform="translate(512, 181.176)"><text font-size="16" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="bold" fill="#1f2329" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="18.824"><tspan x="0" text-anchor="start">vLLM V0（2023）</tspan></tspan></text></g>
<g id="a2:14" transform="translate(512, 213.882)"><text font-size="12" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="14.118"><tspan x="0" text-anchor="start">PagedAttention：块级 KV</tspan></tspan></text></g>
<g id="a2:15" transform="translate(512, 234.882)"><text font-size="12" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="14.118"><tspan x="0" text-anchor="start">先 prefill 后 decode，两类不混批</tspan></tspan></text></g>
<g id="a2:16" transform="translate(512, 255.882)"><text font-size="12" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="14.118"><tspan x="0" text-anchor="start">抢占：recompute 或 swap 到 CPU</tspan></tspan></text></g>
<g id="c2:3" transform="translate(706, 270)"><path fill="none" stroke="#dee0e3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M 0 0 L 16 0"/></g>
<g id="d2:3" transform="translate(709.5, 261.5)"><defs><symbol id="svgicon-d2-3" viewBox="0 0 15 17"><g transform="translate(-709.5 -261.5)"><polygon points="712,264 722,270 712,276" fill="#DEE0E3" /></g></symbol></defs><use href="#svgicon-d2-3" x="0" y="0" width="15" height="17"/></g>
<g id="o2:5" transform="translate(724, 170)"><rect x="0" y="0" width="208" height="200" fill="#fff1e0" stroke="#ffba6b" stroke-width="1" rx="12" ry="12"/></g>
<g id="a2:17" transform="translate(740, 181.176)"><text font-size="16" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="bold" fill="#1f2329" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="18.824"><tspan x="0" text-anchor="start">Sarathi（23–24）</tspan></tspan></text></g>
<g id="a2:18" transform="translate(740, 213.882)"><text font-size="12" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="14.118"><tspan x="0" text-anchor="start">chunked prefill：长 prompt 切段</tspan></tspan></text></g>
<g id="a2:19" transform="translate(740, 234.882)"><text font-size="12" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="14.118"><tspan x="0" text-anchor="start">FastGen：Dynamic SplitFuse</tspan></tspan></text></g>
<g id="a2:20" transform="translate(740, 255.882)"><text font-size="12" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="14.118"><tspan x="0" text-anchor="start">decode 搭 prefill 的便车</tspan></tspan></text></g>
<g id="a2:21" transform="translate(740, 276.882)"><text font-size="12" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="14.118"><tspan x="0" text-anchor="start">固定 token 预算 → 稳定 ITL</tspan></tspan></text></g>
<g id="c2:4" transform="translate(934, 270)"><path fill="none" stroke="#dee0e3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M 0 0 L 16 0"/></g>
<g id="d2:4" transform="translate(937.5, 261.5)"><defs><symbol id="svgicon-d2-4" viewBox="0 0 15 17"><g transform="translate(-937.5 -261.5)"><polygon points="940,264 950,270 940,276" fill="#DEE0E3" /></g></symbol></defs><use href="#svgicon-d2-4" x="0" y="0" width="15" height="17"/></g>
<g id="o2:6" transform="translate(952, 170)"><rect x="0" y="0" width="208" height="200" fill="#fff1e0" stroke="#ffba6b" stroke-width="1" rx="12" ry="12"/></g>
<g id="a2:22" transform="translate(968, 181.176)"><text font-size="16" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="bold" fill="#1f2329" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="18.824"><tspan x="0" text-anchor="start">vLLM V1（2025）</tspan></tspan></text></g>
<g id="a2:23" transform="translate(968, 213.882)"><text font-size="12" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="14.118"><tspan x="0" text-anchor="start">只有 num_computed_tokens</tspan></tspan></text></g>
<g id="a2:24" transform="translate(968, 234.882)"><text font-size="12" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="14.118"><tspan x="0" text-anchor="start">chunked prefill 默认开</tspan></tspan></text></g>
<g id="a2:25" transform="translate(968, 255.882)"><text font-size="12" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="14.118"><tspan x="0" text-anchor="start">抢占只剩 recompute</tspan></tspan></text></g>
<g id="a2:26" transform="translate(968, 276.882)"><text font-size="12" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="14.118"><tspan x="0" text-anchor="start">异步调度默认开</tspan></tspan></text></g>
<g id="o2:7" transform="translate(40, 400)"><rect x="0" y="0" width="1120" height="180" fill="#f5f6f7" stroke="#dee0e3" stroke-width="1" rx="8" ry="8"/></g>
<g id="a2:27" transform="translate(56, 415.29376)"><text font-size="12.5" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#1f2329" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="14.706"><tspan x="0" text-anchor="start">SGLang 走的是另一条路：保留显式的 prefill batch 与 decode batch（get_next_batch_to_run 有新 prefill 就先跑），</tspan></tspan></text></g>
<g id="a2:28" transform="translate(56, 439.29376)"><text font-size="12.5" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#1f2329" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="14.706"><tspan x="0" text-anchor="start">chunked prefill 也在 prefill batch 里做（默认 chunk 8192 @H100），--enable-mixed-chunk 才把 decode 混进来；</tspan></tspan></text></g>
<g id="a2:29" transform="translate(56, 463.29376)"><text font-size="12.5" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#1f2329" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="14.706"><tspan x="0" text-anchor="start">准入靠 new_token_ratio 预留，KV 不够时 retract，同样是重算。</tspan></tspan></text></g>
<g id="a2:30" transform="translate(56, 499.29376)"><text font-size="12.5" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#1f2329" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="14.706"><tspan x="0" text-anchor="start">Llumnix（OSDI 24）把抢占搬到了实例间：KV 满了就把请求连同 KV 热迁移到别的实例，不重算。</tspan></tspan></text></g>
<g id="a2:31" transform="translate(56, 523.29376)"><text font-size="12.5" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#1f2329" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="14.706"><tspan x="0" text-anchor="start">这正好说明单实例里“抢占 = 重算”的代价有多大。V1 选择不做 swap，理由是 CPU↔GPU 换入换出的带宽和复杂度，</tspan></tspan></text></g>
<g id="a2:32" transform="translate(56, 547.29376)"><text font-size="12.5" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#1f2329" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="14.706"><tspan x="0" text-anchor="start">在 chunked prefill + 前缀缓存之后不再划算；需要 CPU 层的场景交给 KV 连接器（VLLM-14）。</tspan></tspan></text></g>
</svg>