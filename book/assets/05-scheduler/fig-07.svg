<g id="a1:43" transform="translate(40, 479.882)"><text font-size="12" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#1f2329" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="14.118"><tspan x="0" text-anchor="start">被抢占时 placeholders 清零，已发出那一步的输出记为 stale：照样交付给用户，但不再改动被重置的计数（_preempt_request）。</tspan></tspan></text></g>
<g id="a1:44" transform="translate(40, 503.882)"><text font-size="12" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#1f2329" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="14.118"><tspan x="0" text-anchor="start">代价：输出晚一步回来。sim 里 preempt 场景 406 → 410 步，TTFT p50 31 → 37 ms；换来的是 CPU 调度与 GPU forward 完全重叠。</tspan></tspan></text></g>
