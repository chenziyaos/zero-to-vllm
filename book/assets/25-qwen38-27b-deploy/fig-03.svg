<g id="a1:47" transform="translate(56, 452.7055)"><text font-size="13" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="15.295"><tspan x="0" text-anchor="start">none 模式：每条序列占 1+k 页状态（k=草稿位数）</tspan></tspan></text></g>
<g id="a1:48" transform="translate(56, 474.7055)"><text font-size="13" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="15.295"><tspan x="0" text-anchor="start">align 模式：占 2+k 页，多一页给 checkpoint 对齐</tspan></tspan></text></g>
