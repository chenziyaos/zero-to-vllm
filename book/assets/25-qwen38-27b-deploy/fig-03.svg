<g id="o1:17" transform="translate(0, 0)"><rect x="0" y="0" width="1200" height="620" fill="#fafbfd" stroke="#dee0e3" stroke-width="1" rx="16" ry="16"/></g>
<g id="a1:34" transform="translate(40, 25.058)"><text font-size="28" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="bold" fill="#1f2329" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="32.942"><tspan x="0" text-anchor="start">GDN 状态：每条序列 147 MiB 固定开销，和上下文长度无关</tspan></tspan></text></g>
<g id="a1:35" transform="translate(40, 75.529)"><text font-size="14" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="16.471"><tspan x="0" text-anchor="start">48 层线性注意力，每层一份 conv 历史加一个 128×128 的 fp32 时间状态矩阵。右图是各 TP / MTP / prefix-caching 组合下的单序列状态</tspan></tspan></text></g>
<g id="a1:36" transform="translate(40, 581.882)"><text font-size="12" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="14.118"><tspan x="0" text-anchor="start">来源：25-qwen38-27b-deploy/deploy_planner.py --scenario state；mamba_utils.py:282 gated_delta_net_state_shape（vllm 0d6f92a）</tspan></tspan></text></g>
<g id="o1:18" transform="translate(40, 140)"><rect x="0" y="0" width="480" height="250" fill="#e1eaff" stroke="#82a7fc" stroke-width="1" rx="12" ry="12"/></g>
<g id="a1:37" transform="translate(56, 151.176)"><text font-size="16" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="bold" fill="#1f2329" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="18.824"><tspan x="0" text-anchor="start">一层 GDN，一条序列（TP1）</tspan></tspan></text></g>
<g id="a1:38" transform="translate(56, 182.7055)"><text font-size="13" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="15.295"><tspan x="0" text-anchor="start">conv 通道数 = 128·16·2 + 128·48 = 10,240</tspan></tspan></text></g>
<g id="a1:39" transform="translate(56, 204.7055)"><text font-size="13" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="15.295"><tspan x="0" text-anchor="start">conv 历史：10,240 × 3（k0）× 2 B = 60 KiB</tspan></tspan></text></g>
<g id="a1:40" transform="translate(56, 226.7055)"><text font-size="13" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="15.295"><tspan x="0" text-anchor="start">时间状态矩阵：48 个 v 头 × 128² × 4 B</tspan></tspan></text></g>
<g id="a1:41" transform="translate(56, 248.7055)"><text font-size="13" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="15.295"><tspan x="0" text-anchor="start">= 3,072 KiB（fp32，线性注意力的 KᵀV）</tspan></tspan></text></g>
<g id="a1:42" transform="translate(56, 270.7055)"><text font-size="13" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="15.295"><tspan x="0" text-anchor="start">单层合计 3,132 KiB；48 层 = 146.8 MiB</tspan></tspan></text></g>
<g id="a1:44" transform="translate(56, 314.7055)"><text font-size="13" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="15.295"><tspan x="0" text-anchor="start">对比：16 层全注意力，每多一个 token 多 64 KiB</tspan></tspan></text></g>
<g id="a1:45" transform="translate(56, 336.7055)"><text font-size="13" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="15.295"><tspan x="0" text-anchor="start">GDN 状态不随 token 数增长，只随层数和 TP 变</tspan></tspan></text></g>
