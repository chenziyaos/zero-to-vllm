<g id="o2:1" transform="translate(0, 0)"><rect x="0" y="0" width="1200" height="740" fill="#fafbfd" stroke="#dee0e3" stroke-width="1" rx="16" ry="16"/></g>
<g id="a2:1" transform="translate(40, 25.058)"><text font-size="28" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="bold" fill="#1f2329" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="32.942"><tspan x="0" text-anchor="start">MLA 的后端其实在两条路径间切换：decode 吸收 W_UK 走 MQA，prefill 解压成 MHA</tspan></tspan></text></g>
<g id="a2:2" transform="translate(40, 75.529)"><text font-size="14" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="16.471"><tspan x="0" text-anchor="start">decode 每个 token 只看一次 KV，读 latent 最省；prefill 一次处理成千上万 token，先解压再算 MHA 的 FLOPs 反而更少</tspan></tspan></text></g>
<g id="a2:3" transform="translate(40, 701.882)"><text font-size="12" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="14.118"><tspan x="0" text-anchor="start">来源：10-attention-backend/sim_backend_select.py --scenario mla；vllm mla_attention.py:1088–1105、:1242–1354、:3237、:3396；DeepSeek-V2 论文 §2.1.3</tspan></tspan></text></g>
<g id="o2:2" transform="translate(40, 140)"><rect x="0" y="0" width="545" height="150" fill="#e4fae1" stroke="#8ee085" stroke-width="1" rx="12" ry="12"/></g>
