<g id="a1:33" transform="translate(40, 613.29376)"><text font-size="12.5" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="14.706"><tspan x="0" text-anchor="start">full 组照样 2048 块全进哈希表。命中长度先由 full 组定上限，再由 SW 组在“有尾巴”的位置里挑最右的一个，不动点迭代后两组一致。</tspan></tspan></text></g>
