<g id="a1:39" transform="translate(40, 613.29376)"><text font-size="12.5" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="14.706"><tspan x="0" text-anchor="start">random 一行是对照：没有共享前缀时，前缀缓存只剩哈希和查表的开销，命中率 0%。</tspan></tspan></text></g>
