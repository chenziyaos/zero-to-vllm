<g id="a1:2" transform="translate(40, 75.529)"><text font-size="14" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="16.471"><tspan x="0" text-anchor="start">每 token 每层的 KV 字节数决定了一切容量账；条形长度按字节线性绘制，右侧换算成整模型每 token 和 54.84 GiB 能装的 token 数</tspan></tspan></text></g>
