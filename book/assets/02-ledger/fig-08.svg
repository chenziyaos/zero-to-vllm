<g id="a1:30" transform="translate(56, 589.29376)"><text font-size="12.5" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#d46b08" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="14.706"><tspan x="0" text-anchor="start">差 4.8 GiB 的来源：SGLang 的 12 GiB 激活预留是与模型无关的系数，宁多勿少；vLLM 量的是这个模型、这个批大小的真实峰值 1.43 GiB</tspan></tspan></text></g>
