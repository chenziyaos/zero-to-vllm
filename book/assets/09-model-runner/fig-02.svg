<g id="a1:2" transform="translate(40, 75.529)"><text font-size="14" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="16.471"><tspan x="0" text-anchor="start">dispatcher 在每步前把 (运行时模式, BatchDescriptor) 写进 forward context；两层 wrapper 都读它，模式对不上就直接透传</tspan></tspan></text></g>
