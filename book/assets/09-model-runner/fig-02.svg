<g id="a1:18" transform="translate(90, 394.7055)"><text font-size="13" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#1f2329" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="15.295"><tspan x="0" text-anchor="start">注意力在段间 eager 跑：PIECEWISE 模式下它不在任何图里，</tspan></tspan></text></g>
<g id="a1:19" transform="translate(90, 418.7055)"><text font-size="13" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#1f2329" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="15.295"><tspan x="0" text-anchor="start">FULL 模式下它被外层那张大图一起录进去</tspan></tspan></text></g>
<g id="a1:20" transform="translate(90, 455.29376)"><text font-size="12.5" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="14.706"><tspan x="0" text-anchor="start">attention 的输出张量由调用方预分配，所以分段图里也包含显存分配</tspan></tspan></text></g>
