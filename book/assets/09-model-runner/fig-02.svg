<g id="a1:27" transform="translate(856, 371.29376)"><text font-size="12.5" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="14.706"><tspan x="0" text-anchor="start">内层逐段捕获/重放，注意力 eager</tspan></tspan></text></g>
<g id="o1:13" transform="translate(840, 422)"><rect x="0" y="0" width="320" height="100" fill="#f5f6f7" stroke="#dee0e3" stroke-width="1" rx="10" ry="10"/></g>
