<g id="a1:29" transform="translate(856, 463.29376)"><text font-size="12.5" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#1f2329" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="14.706"><tspan x="0" text-anchor="start">外层透传</tspan></tspan></text></g>
<g id="a1:30" transform="translate(856, 487.29376)"><text font-size="12.5" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="14.706"><tspan x="0" text-anchor="start">内层透传，整模型 eager</tspan></tspan></text></g>
<g id="a1:31" transform="translate(40, 564.7055)"><text font-size="13" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#1f2329" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="15.295"><tspan x="0" text-anchor="start">每个 wrapper 首次见到一个 BatchDescriptor 就捕获（捕获期间关 gc，输出只留弱引用），之后同一个描述符直接 replay。</tspan></tspan></text></g>
<g id="a1:32" transform="translate(40, 590.7055)"><text font-size="13" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="15.295"><tspan x="0" text-anchor="start">warmup 由 runner 控制：用 NONE 模式先跑一遍，FULL 要求 warmup 时注意力也真的执行过，否则 JIT 内核会在捕获时才编译。</tspan></tspan></text></g>
<g id="a1:33" transform="translate(40, 630.7055)"><text font-size="13" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#1f2329" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="15.295"><tspan x="0" text-anchor="start">旧设计里 FULL 图和编译是绑死的（全有或全无）；PR #20059 把两层拆开，才有了 FULL_DECODE_ONLY 和 FULL_AND_PIECEWISE。</tspan></tspan></text></g>
<g id="a1:34" transform="translate(40, 656.7055)"><text font-size="13" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="15.295"><tspan x="0" text-anchor="start">同一个模型对象里同时挂着 51 张 FULL 图和 51 × 37 张分段图，按每步的 batch 形状选一套。</tspan></tspan></text></g>
