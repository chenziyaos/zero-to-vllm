<g id="a1:24" transform="translate(220, 535.29376)"><text font-size="12.5" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="14.706"><tspan x="0" text-anchor="start">深灰 = eager 段（注意力 / 不支持进图的算子）。breakable 的断点由运行时决定，PIECEWISE 的断点由 splitting_ops 在编译期决定。</tspan></tspan></text></g>
<g id="a1:25" transform="translate(40, 572.3525)"><text font-size="15" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="bold" fill="#1f2329" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="17.648"><tspan x="0" text-anchor="start">vLLM 什么时候自动用 breakable</tspan></tspan></text></g>
