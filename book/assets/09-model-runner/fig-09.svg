<g id="a1:27" transform="translate(40, 627.29376)"><text font-size="12.5" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#1f2329" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="14.706"><tspan x="0" text-anchor="start">和 VLLM_BATCH_INVARIANT 时自动置位；开了 breakable，编译模式就设成 NONE，不再走 Dynamo。</tspan></tspan></text></g>
<g id="a1:28" transform="translate(40, 661.29376)"><text font-size="12.5" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="14.706"><tspan x="0" text-anchor="start">MRv2（v1/worker/gpu/）的 CudaGraphManager 有 run_fullgraph / init_breakable_cg_runner / run_pw_graph 三条路径；</tspan></tspan></text></g>
<g id="a1:29" transform="translate(40, 685.29376)"><text font-size="12.5" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="14.706"><tspan x="0" text-anchor="start">piecewise_capture_available 要求开了 breakable 或模型里有编译过的子模块，否则 F&amp;P 降成 FDO。</tspan></tspan></text></g>
</svg>