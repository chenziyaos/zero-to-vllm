<g id="a1:1" transform="translate(40, 25.058)"><text font-size="28" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="bold" fill="#1f2329" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="32.942"><tspan x="0" text-anchor="start">第三条路：breakable graph 不靠 Dynamo 切图，在运行时把不能进图的段落留在外面</tspan></tspan></text></g>
<g id="a1:2" transform="translate(40, 75.529)"><text font-size="14" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="16.471"><tspan x="0" text-anchor="start">SGLang 在 CUDA 上 prefill 默认 breakable、decode 默认 full；vLLM 受 sglang PR #19102 启发加了 BreakableCUDAGraphWrapper，默认关、部分架构自动开</tspan></tspan></text></g>
<g id="a1:3" transform="translate(40, 741.882)"><text font-size="12" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="14.118"><tspan x="0" text-anchor="start">来源：sglang cuda_graph_config.py:123/150、breakable_cuda_graph_backend.py；vllm breakable_cudagraph.py:247、config/vllm.py:87/861；gpu/model_runner.py:770</tspan></tspan></text></g>
