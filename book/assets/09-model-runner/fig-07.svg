<g id="a1:35" transform="translate(40, 492.7055)"><text font-size="13" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#1f2329" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="15.295"><tspan x="0" text-anchor="start">--enforce-eager 还关掉 kernel_config.enable_jit_warmup，等价于 -cc.mode=none -cc.cudagraph_mode=none --kernel_config.enable_jit_warmup=False。</tspan></tspan></text></g>
<g id="a1:36" transform="translate(40, 518.7055)"><text font-size="13" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="15.295"><tspan x="0" text-anchor="start">-O0 保留 JIT warmup，只是不编译不捕获。想测"纯 PyTorch 前向"用 enforce-eager，想测"不编译但内核已热"用 -O0。</tspan></tspan></text></g>
<g id="a1:37" transform="translate(40, 562.3525)"><text font-size="15" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="bold" fill="#1f2329" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="17.648"><tspan x="0" text-anchor="start">覆盖档位的写法</tspan></tspan></text></g>
<g id="a1:38" transform="translate(40, 594.7055)"><text font-size="13" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#245bdb" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="15.295"><tspan x="0" text-anchor="start">vllm serve M -O1 -cc.cudagraph_mode=FULL_DECODE_ONLY</tspan></tspan></text></g>
<g id="a1:39" transform="translate(40, 620.7055)"><text font-size="13" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#245bdb" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="15.295"><tspan x="0" text-anchor="start">vllm serve M -cc '{"cudagraph_mode":"PIECEWISE","max_cudagraph_capture_size":256}'</tspan></tspan></text></g>
<g id="a1:40" transform="translate(40, 653.29376)"><text font-size="12.5" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="14.706"><tspan x="0" text-anchor="start">-O＜n＞ 由 argparse_utils.py:395 改写成 --optimization-level；-cc 是 --compilation-config 的短名，支持点号写单个字段。</tspan></tspan></text></g>
<g id="a1:41" transform="translate(40, 677.29376)"><text font-size="12.5" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="14.706"><tspan x="0" text-anchor="start">自定义 pass 的收益来自官方博客：AllReduce+RMSNorm 最多 15%，SiLU+FP8 quant 最多 8%，Attention+FP8 quant 最多 7%。</tspan></tspan></text></g>
