<g id="a1:2" transform="translate(40, 75.529)"><text font-size="14" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="16.471"><tspan x="0" text-anchor="start">左：TokenToKVPoolAllocator 的 free_pages；右：page_size 由后端决定，FlashMLA 等 kernel 会把它强制拉到 32–128</tspan></tspan></text></g>
