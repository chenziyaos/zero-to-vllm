<g id="a1:40" transform="translate(56, 533.29376)"><text font-size="12.5" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="14.706"><tspan x="0" text-anchor="start">vLLM 从“块”出发往细里走：前缀哈希按 hash_block_size 算，管理器块可以是 kernel 块的整数倍（虚拟块）；混合模型按组各管各的（VLLM-08）。</tspan></tspan></text></g>
<g id="a1:41" transform="translate(56, 554.79376)"><text font-size="12.5" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="14.706"><tspan x="0" text-anchor="start">SGLang 从“token”出发往粗里走：MLA、FA4、TRT-LLM 后端都要求整页，page_size 一旦 ＞ 1，前缀复用也只能按页对齐。</tspan></tspan></text></g>
<g id="a1:42" transform="translate(40, 635.29376)"><text font-size="12.5" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="14.706"><tspan x="0" text-anchor="start">用 SGLang 对照时记得看启动参数里的 page_size：同一模型换注意力后端，内存粒度可能从 1 变成 64，前缀缓存的命中长度也跟着变。</tspan></tspan></text></g>
</svg>