<g id="a1:26" transform="translate(636, 479.29376)"><text font-size="12.5" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="14.706"><tspan x="0" text-anchor="start">SGLang：retract_decode 撤回输出最少的请求</tspan></tspan></text></g>
<g id="a1:27" transform="translate(40, 603.29376)"><text font-size="12.5" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#1f2329" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="14.706"><tspan x="0" text-anchor="start">水位 5% 让抢占从 1538 次降到 272 次，平均批只少 0.7。V1 默认 0；开着前缀缓存时，被抢请求的满块带哈希回到队尾，再调度时多半能命中，重算代价比模拟里小。</tspan></tspan></text></g>
<g id="a1:28" transform="translate(40, 627.29376)"><text font-size="12.5" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="14.706"><tspan x="0" text-anchor="start">想看自己的服务抢占多不多：vllm:num_preemptions_total 计数器；持续增长就加显存比例、降 max_num_seqs，或者试水位。</tspan></tspan></text></g>
