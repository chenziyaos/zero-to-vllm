<g id="o1:1" transform="translate(0, 0)"><rect x="0" y="0" width="1200" height="700" fill="#fafbfd" stroke="#dee0e3" stroke-width="1" rx="16" ry="16"/></g>
<g id="a1:1" transform="translate(40, 25.058)"><text font-size="28" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="bold" fill="#1f2329" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="32.942"><tspan x="0" text-anchor="start">两种索引表：vLLM 块表 10 MiB，SGLang 逐 token 表 640 MiB</tspan></tspan></text></g>
<g id="a1:2" transform="translate(40, 75.529)"><text font-size="14" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="16.471"><tspan x="0" text-anchor="start">同一张 H100、Qwen3-8B、上下文 40,960；两边都按“最大请求数 × 最大长度”预分配，区别在一格代表 16 个 token 还是 1 个</tspan></tspan></text></g>
<g id="a1:3" transform="translate(40, 661.882)"><text font-size="12" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="14.118"><tspan x="0" text-anchor="start">来源：07-paged-kv/sim_block_pool.py --scenario h100；vllm worker/block_table.py:49；sglang mem_cache/memory_pool.py:376、mem_cache/kv_cache_configurator.py:3119</tspan></tspan></text></g>
<g id="o1:2" transform="translate(40, 130)"><rect x="0" y="0" width="540" height="200" fill="#e1eaff" stroke="#82a7fc" stroke-width="1" rx="12" ry="12"/></g>
<g id="a1:4" transform="translate(56, 141.176)"><text font-size="16" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="bold" fill="#1f2329" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="18.824"><tspan x="0" text-anchor="start">vLLM：block_table</tspan></tspan></text></g>
<g id="a1:5" transform="translate(56, 172.7055)"><text font-size="13" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="15.295"><tspan x="0" text-anchor="start">int32 [max_num_seqs, 宽度] = [1024, 2560]</tspan></tspan></text></g>
<g id="a1:6" transform="translate(56, 194.7055)"><text font-size="13" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="15.295"><tspan x="0" text-anchor="start">一格 = 一个块号 = 16 个 token</tspan></tspan></text></g>
<g id="a1:7" transform="translate(56, 216.7055)"><text font-size="13" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="15.295"><tspan x="0" text-anchor="start">CPU pinned + GPU 各一份，共 2 × 10.0 MiB</tspan></tspan></text></g>
<g id="a1:8" transform="translate(56, 238.7055)"><text font-size="13" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="15.295"><tspan x="0" text-anchor="start">slot_mapping int64 [8192] = 64 KiB，每步现算</tspan></tspan></text></g>
<g id="o1:3" transform="translate(620, 130)"><rect x="0" y="0" width="540" height="200" fill="#fff1e0" stroke="#ffba6b" stroke-width="1" rx="12" ry="12"/></g>
<g id="a1:9" transform="translate(636, 141.176)"><text font-size="16" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="bold" fill="#1f2329" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="18.824"><tspan x="0" text-anchor="start">SGLang：req_to_token</tspan></tspan></text></g>
<g id="a1:10" transform="translate(636, 172.7055)"><text font-size="13" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="15.295"><tspan x="0" text-anchor="start">int32 [max_num_reqs + 1, context_len + 4]</tspan></tspan></text></g>
<g id="a1:11" transform="translate(636, 194.7055)"><text font-size="13" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="15.295"><tspan x="0" text-anchor="start">= [4097, 40,964]，一格 = 一个 KV 槽位</tspan></tspan></text></g>
<g id="a1:12" transform="translate(636, 216.7055)"><text font-size="13" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="15.295"><tspan x="0" text-anchor="start">max_num_reqs = min(clamp(364,487/40,960×512,</tspan></tspan></text></g>
<g id="a1:13" transform="translate(636, 238.7055)"><text font-size="13" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="15.295"><tspan x="0" text-anchor="start">2048, 4096), 364,487 // 2) = 4096</tspan></tspan></text></g>
<g id="a1:14" transform="translate(186, 378.7055)"><text font-size="13" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#1f2329" text-anchor="end" dominant-baseline="alphabetic" x="180"><tspan x="180" y="15.295"><tspan x="-1.82" text-anchor="start">vLLM block_table [1024, 2560]</tspan></tspan></text></g>
<g id="o1:4" transform="translate(380, 370)"><rect x="0" y="0" width="9.997" height="34" fill="#3370ff" stroke="#3370ff" stroke-width="1" rx="3.998438" ry="3.998438"/></g>
<g id="a1:15" transform="translate(399.9969, 377.11725)"><text font-size="13.5" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="bold" fill="#245bdb" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="15.883"><tspan x="0" text-anchor="start">10.0 MiB</tspan></tspan></text></g>
<g id="a1:16" transform="translate(149, 434.7055)"><text font-size="13" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#1f2329" text-anchor="end" dominant-baseline="alphabetic" x="217"><tspan x="217" y="15.295"><tspan x="-0.85" text-anchor="start">SGLang req_to_token，同样 1024 行</tspan></tspan></text></g>
<g id="o1:5" transform="translate(380, 426)"><rect x="0" y="0" width="160.15" height="34" fill="#ffba6b" stroke="#ff8800" stroke-width="1" rx="4" ry="4"/></g>
<g id="a1:17" transform="translate(550.14996, 433.11725)"><text font-size="13.5" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="bold" fill="#d46b08" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="15.883"><tspan x="0" text-anchor="start">160.2 MiB</tspan></tspan></text></g>
<g id="a1:18" transform="translate(120, 490.7055)"><text font-size="13" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#1f2329" text-anchor="end" dominant-baseline="alphabetic" x="246"><tspan x="246" y="15.295"><tspan x="-0.86" text-anchor="start">SGLang req_to_token 默认 [4097, 40,964]</tspan></tspan></text></g>
<g id="o1:6" transform="translate(380, 482)"><rect x="0" y="0" width="640" height="34" fill="#ff8800" stroke="#ff8800" stroke-width="1" rx="4" ry="4"/></g>
<g id="a1:19" transform="translate(1030, 489.11725)"><text font-size="13.5" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="bold" fill="#d46b08" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="15.883"><tspan x="0" text-anchor="start">640.2 MiB</tspan></tspan></text></g>
<g id="a1:20" transform="translate(40, 555.29376)"><text font-size="12.5" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#1f2329" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="14.706"><tspan x="0" text-anchor="start">每格表示的 token 数决定了表的大小：同样 1024 行，逐 token 表正好是块表的 16 倍。SGLang 默认 max_num_reqs 是 4096，再翻 4 倍。</tspan></tspan></text></g>
<g id="a1:21" transform="translate(40, 579.29376)"><text font-size="12.5" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#1f2329" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="14.706"><tspan x="0" text-anchor="start">换来的东西：没有块内碎片，前缀能复用到单个 token（RadixAttention），注意力 kernel 直接拿 token 级索引；page_size ＞ 1 的后端走同一张表，只是分配按页。</tspan></tspan></text></g>
<g id="a1:22" transform="translate(40, 603.29376)"><text font-size="12.5" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="14.706"><tspan x="0" text-anchor="start">640 MiB 从 KV 池里扣，约等于 4,500 个 token 的 KV；对 80 GB 卡无关紧要，对 24 GB 卡或长上下文 + 大并发要留意 --max-running-requests。</tspan></tspan></text></g>
</svg>