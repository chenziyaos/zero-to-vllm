<g id="a1:2" transform="translate(40, 75.529)"><text font-size="14" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="16.471"><tspan x="0" text-anchor="start">L1 把权重卸到 CPU pinned 内存、丢掉 KV；L2 两样都丢，唤醒后重读权重。代价是主机内存，或者一次 reload</tspan></tspan></text></g>
