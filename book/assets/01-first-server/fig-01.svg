<g id="o1:1" transform="translate(0, 0)"><rect x="0" y="0" width="1200" height="620" fill="#fafbfd" stroke="#dee0e3" stroke-width="1" rx="16" ry="16"/></g>
<g id="a1:1" transform="translate(40, 25.058)"><text font-size="28" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="bold" fill="#1f2329" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="32.942"><tspan x="0" text-anchor="start">装上 wheel 只完成一半：kernel 包和驱动不对齐，首启就会现场编译</tspan></tspan></text></g>
<g id="a1:2" transform="translate(40, 75.529)"><text font-size="14" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="16.471"><tspan x="0" text-anchor="start">三种装法殊途同归，最后都要过 download-kernels 和驱动版本两道检查；Docker 镜像把前两步打包好了</tspan></tspan></text></g>
<g id="a1:3" transform="translate(40, 581.882)"><text font-size="12" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="14.118"><tspan x="0" text-anchor="start">来源：vLLM Docs GPU Installation；vllm/utils/flashinfer.py；vLLM v0.32.0 Release Notes</tspan></tspan></text></g>
