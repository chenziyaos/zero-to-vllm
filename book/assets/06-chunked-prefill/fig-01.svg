<g id="a1:33" transform="translate(40, 575.29376)"><text font-size="12.5" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#1f2329" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="14.706"><tspan x="0" text-anchor="start">同样切 8192，vLLM 的四段是 265.7 / 332.9 / 400.1 / 467.3 ms，越往后越慢：每段都要和前面已算好的 KV 做注意力（s + c/2 越来越大）。</tspan></tspan></text></g>
<g id="a1:34" transform="translate(40, 599.29376)"><text font-size="12.5" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#1f2329" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="14.706"><tspan x="0" text-anchor="start">长请求的 TTFT 三者只差 3%（1.45–1.50 s），差别全在陪跑的 decode：关 chunked 一次停 1.45 s，SGLang 默认连停 4 段，vLLM 每段都放行一次。</tspan></tspan></text></g>
<g id="a1:35" transform="translate(40, 623.29376)"><text font-size="12.5" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="14.706"><tspan x="0" text-anchor="start">切块本身不省总算力，省的是“最长一次停多久”。</tspan></tspan></text></g>
