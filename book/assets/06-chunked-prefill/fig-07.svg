<g id="a1:19" transform="translate(56, 473.882)"><text font-size="12" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="14.118"><tspan x="0" text-anchor="start">rem_chunk_tokens = chunked_prefill_size − num_mixed_decode_tokens</tspan></tspan></text></g>
<g id="a1:20" transform="translate(56, 494.882)"><text font-size="12" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="14.118"><tspan x="0" text-anchor="start">rem_total_tokens = 空闲 KV − running 预留（new_token_ratio）</tspan></tspan></text></g>
<g id="a1:21" transform="translate(56, 515.882)"><text font-size="12" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="14.118"><tspan x="0" text-anchor="start">add_chunked_req：上一步没切完的那条先续上，同时只有一条</tspan></tspan></text></g>
<g id="a1:22" transform="translate(56, 536.882)"><text font-size="12" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="14.118"><tspan x="0" text-anchor="start">H100 80 GB 默认 chunked_prefill_size = 8192</tspan></tspan></text></g>
<g id="o1:9" transform="translate(640, 524)"><rect x="0" y="0" width="520" height="50" fill="#e4fae1" stroke="#8ee085" stroke-width="1" rx="12" ry="12"/></g>
<g id="a1:23" transform="translate(656, 539.882)"><text font-size="12" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#1f2329" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="14.118"><tspan x="0" text-anchor="start">mixed 时 decode 内存不够：decode 本步不参加，也不 retract（4441-4470）</tspan></tspan></text></g>
<g id="a1:24" transform="translate(40, 605.29376)"><text font-size="12.5" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#1f2329" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="14.706"><tspan x="0" text-anchor="start">vLLM 没有“prefill batch / decode batch”之分：同一个 token 预算，running 先排，剩余的给 prompt。SGLang 开 mixed-chunk 后在这个场景里行为与 vLLM 一致，</tspan></tspan></text></g>
<g id="a1:25" transform="translate(40, 629.29376)"><text font-size="12.5" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="14.706"><tspan x="0" text-anchor="start">sim 的 long / mixed 两个场景数字完全相同；不开时它多了一种“prefill 优先、decode 让路”的语义，对离线批处理和首 token 敏感的负载反而合适。</tspan></tspan></text></g>
</svg>