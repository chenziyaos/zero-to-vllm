<g id="o2:1" transform="translate(0, 0)"><rect x="0" y="0" width="1200" height="640" fill="#fafbfd" stroke="#dee0e3" stroke-width="1" rx="16" ry="16"/></g>
<g id="a2:1" transform="translate(40, 25.058)"><text font-size="28" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="bold" fill="#1f2329" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="32.942"><tspan x="0" text-anchor="start">2024 年 vLLM 只有 38% 时间在跑 GPU，之后三次改造都在解决这一个问题</tspan></tspan></text></g>
<g id="a2:2" transform="translate(40, 75.529)"><text font-size="14" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="16.471"><tspan x="0" text-anchor="start">v0.6.0 的剖析：Llama 3 8B、单张 H100，HTTP API server 占 33%，调度与输入准备占 29%，GPU 执行 38%</tspan></tspan></text></g>
<g id="a2:3" transform="translate(40, 601.882)"><text font-size="12" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="14.118"><tspan x="0" text-anchor="start">来源：vLLM Blog 2024-09-05（v0.6.0，PR #6883）、2025-01-27（V1 alpha）、2026-03-24（Model Runner V2）</tspan></tspan></text></g>
<g id="a2:4" transform="translate(80, 148.529)"><text font-size="14" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="bold" fill="#1f2329" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="16.471"><tspan x="0" text-anchor="start">v0.5.x 一步的时间构成（Llama 3 8B · 1×H100）</tspan></tspan></text></g>
<g id="o2:2" transform="translate(80, 180)"><rect x="0" y="0" width="340.2" height="44" fill="#3370ff" stroke="#82a7fc" stroke-width="1" rx="4" ry="4"/></g>
