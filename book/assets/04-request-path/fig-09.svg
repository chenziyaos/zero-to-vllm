<g id="a2:23" transform="translate(56, 503.29376)"><text font-size="12.5" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#1f2329" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="14.706"><tspan x="0" text-anchor="start">共同的判断：小模型在 H100 上一步只要几毫秒，Python 侧每多 1 ms 都直接变成 GPU 空转。</tspan></tspan></text></g>
<g id="a2:24" transform="translate(56, 527.29376)"><text font-size="12.5" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#1f2329" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="14.706"><tspan x="0" text-anchor="start">本章的进程图就是这三次改造叠加的结果：HTTP 一个进程，调度一个进程，GPU 一个进程（或同进程的 uni executor），</tspan></tspan></text></g>
<g id="a2:25" transform="translate(56, 551.29376)"><text font-size="12.5" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#1f2329" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="14.706"><tspan x="0" text-anchor="start">再用 batch queue 让调度和 GPU 重叠。SGLang 走的是另一条路：调度和 GPU 同进程，用 overlap 调度器重叠。</tspan></tspan></text></g>
</svg>