<g id="a2:37" transform="translate(200, 460.882)"><text font-size="12" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="14.118"><tspan x="0" text-anchor="start">sched N+1 用的是“假设第 N 步每条请求都多出 1 个 token”的状态：num_computed_tokens 先加上，实际的 token id 在 GPU 上直接接上</tspan></tspan></text></g>
<g id="o2:26" transform="translate(40, 505)"><rect x="0" y="0" width="1120" height="80" fill="#f5f6f7" stroke="#dee0e3" stroke-width="1" rx="8" ry="8"/></g>
