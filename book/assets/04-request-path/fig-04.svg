<g id="a2:39" transform="translate(56, 538.29376)"><text font-size="12.5" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#1f2329" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="14.706"><tspan x="0" text-anchor="start">队列满了才 pop() 最老的 future 并阻塞。PP=2 时 batch_queue_size=PP+1=3（sim_processes.py --tp 4 --pp 2 输出）。</tspan></tspan></text></g>
<g id="a2:40" transform="translate(56, 561.29376)"><text font-size="12.5" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#1f2329" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="14.706"><tspan x="0" text-anchor="start">结构化输出需要上一步 token 才能算 bitmask：pending_structured_output_tokens 时采样推迟到下一轮（deferred_scheduler_output）。</tspan></tspan></text></g>
