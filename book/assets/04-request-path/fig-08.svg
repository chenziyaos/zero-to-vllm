<g id="a1:27" transform="translate(626, 513.882)"><text font-size="12" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="14.118"><tspan x="0" text-anchor="start">auto：非 PD → round_robin；PD prefill → follow_bootstrap_room</tspan></tspan></text></g>
