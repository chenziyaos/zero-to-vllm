<g id="o1:1" transform="translate(0, 0)"><rect x="0" y="0" width="1200" height="680" fill="#fafbfd" stroke="#dee0e3" stroke-width="1" rx="16" ry="16"/></g>
<g id="a1:1" transform="translate(40, 25.058)"><text font-size="28" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="bold" fill="#1f2329" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="32.942"><tspan x="0" text-anchor="start">DP 选路：vLLM 默认按负载打分并惩罚 KV 吃紧的队列，SGLang 默认 round_robin</tspan></tspan></text></g>
<g id="a1:2" transform="translate(40, 75.529)"><text font-size="14" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="16.471"><tspan x="0" text-anchor="start">vLLM DPLBAsyncMPClient 每个前端独立打分，coordinator 每 100 ms 推一次快照；SGLang 的 DataParallelController 是单独进程，auto 在非 PD 时解析成 round_robin</tspan></tspan></text></g>
<g id="a1:3" transform="translate(40, 641.882)"><text font-size="12" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="14.118"><tspan x="0" text-anchor="start">来源：vllm/v1/engine/core_client.py:1771-1830；sglang/srt/managers/data_parallel_controller.py:122-160、880；arg_groups/serving_hook.py:217-236（8fabf5e）</tspan></tspan></text></g>
<g id="a1:4" transform="translate(40, 133.529)"><text font-size="14" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="bold" fill="#1f2329" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="16.471"><tspan x="0" text-anchor="start">vLLM：score = max(client_count × inflight, waiting + running) + waiting × 6 × max(0, kv − 0.5)</tspan></tspan></text></g>
