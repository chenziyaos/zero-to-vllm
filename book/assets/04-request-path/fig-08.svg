<g id="a1:20" transform="translate(320, 425.882)"><text font-size="12" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="14.118"><tspan x="0" text-anchor="start">DP0 的 waiting 比 DP1 多 1，但 kv=0.95 让它多出 8.1 分；kv ≤ 0.5 时惩罚为 0，退化为负载均衡 + 轮转打破平局</tspan></tspan></text></g>
