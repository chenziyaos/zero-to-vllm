<g id="a1:276" transform="translate(40, 25.058)"><text font-size="28" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="bold" fill="#1f2329" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="32.942"><tspan x="0" text-anchor="start">vLLM 的 0.92 圈的是整卡，SGLang 的 mem_fraction_static 只圈权重加 KV</tspan></tspan></text></g>
<g id="a1:277" transform="translate(40, 75.529)"><text font-size="14" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="16.471"><tspan x="0" text-anchor="start">两个旋钮名字像，口径不同：vLLM 先实测激活和图再算 KV；SGLang 先按公式预留激活和图，剩下的给权重和 KV 池</tspan></tspan></text></g>
