<g id="o1:183" transform="translate(40, 420)"><rect x="0" y="0" width="1120" height="172" fill="#f5f6f7" stroke="#dee0e3" stroke-width="1" rx="12" ry="12"/></g>
<g id="a1:297" transform="translate(56, 430.3525)"><text font-size="15" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="bold" fill="#1f2329" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="17.648"><tspan x="0" text-anchor="start">SGLang 的预留公式（单位 MB，H100 80GB、chunked_prefill_size 8192、TP=1）</tspan></tspan></text></g>
<g id="a1:298" transform="translate(56, 462.7055)"><text font-size="13" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#1f2329" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="15.295"><tspan x="0" text-anchor="start">reserved = 512 + 8192 × 1.5 + 1 × 1 / 8 × 1024 + decode_max_bs 256 × 2 + prefill 图预留</tspan></tspan></text></g>
<g id="a1:299" transform="translate(56, 486.7055)"><text font-size="13" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#1f2329" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="15.295"><tspan x="0" text-anchor="start">≈ 13,440 MB 起；显存 ＞60 GB 时不低于 10,240 MB</tspan></tspan></text></g>
<g id="a1:300" transform="translate(56, 510.7055)"><text font-size="13" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#1f2329" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="15.295"><tspan x="0" text-anchor="start">mem_fraction_static = (gpu_mem − reserved) / gpu_mem ≈ (81,559 − 13,440) / 81,559 ≈ 0.83</tspan></tspan></text></g>
<g id="a1:301" transform="translate(56, 544.7055)"><text font-size="13" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#d46b08" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="15.295"><tspan x="0" text-anchor="start">迁移经验：从 SGLang 搬到 vLLM，不要把 0.83 原样填给 --gpu-memory-utilization；两边 KV 容量要用启动日志里的 token 数对齐</tspan></tspan></text></g>
</svg>