<g id="a1:2" transform="translate(40, 75.529)"><text font-size="14" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="16.471"><tspan x="0" text-anchor="start">vLLM 的标签内容不限，只在非 draft 且带 ready 标签时检查；SGLang 的 Type 是 8 个词的封闭集合，硬件标签必须全大写</tspan></tspan></text></g>
