<g id="a1:1" transform="translate(40, 25.058)"><text font-size="28" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="bold" fill="#1f2329" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="32.942"><tspan x="0" text-anchor="start">SGLang 的 hook 像洋葱：REPLACE 在最里层，越晚注册的越先执行</tspan></tspan></text></g>
<g id="a1:2" transform="translate(40, 75.529)"><text font-size="14" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="16.471"><tspan x="0" text-anchor="start">同一个 target 上挂多个 hook 时，先把 REPLACE 换成核心，再按注册顺序一层层往外包 BEFORE / AFTER / AROUND</tspan></tspan></text></g>
<g id="a1:3" transform="translate(40, 681.882)"><text font-size="12" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="14.118"><tspan x="0" text-anchor="start">来源：20-contrib/sim_plugins.py --scenario hooks；srt/plugins/hook_registry.py（8fabf5e）；custom_op.py 338（0d6f92a）</tspan></tspan></text></g>
<g id="a1:4" transform="translate(40, 123.529)"><text font-size="14" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="bold" fill="#1f2329" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="16.471"><tspan x="0" text-anchor="start">注册 h1:AFTER → h2:AROUND → h3:BEFORE</tspan></tspan></text></g>
