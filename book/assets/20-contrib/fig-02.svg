<g id="a1:1" transform="translate(40, 25.058)"><text font-size="28" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="bold" fill="#1f2329" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="32.942"><tspan x="0" text-anchor="start">VLLM_PLUGINS 不 strip：多一个空格，endpoint 插件就静默消失</tspan></tspan></text></g>
<g id="a1:2" transform="translate(40, 75.529)"><text font-size="14" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="16.471"><tspan x="0" text-anchor="start">envs.py 只做 split(",")；"" 解析成 [""]，什么都不加载。SGLang 先 strip 再丢空串，"" 等于没设</tspan></tspan></text></g>
<g id="a1:3" transform="translate(40, 661.882)"><text font-size="12" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="14.118"><tspan x="0" text-anchor="start">来源：20-contrib/sim_plugins.py --scenario env；envs.py 1175–1179，plugins/__init__.py 36–74（0d6f92a）；srt/plugins/__init__.py 52–55（8fabf5e）</tspan></tspan></text></g>
<g id="a1:4" transform="translate(40, 127.3525)"><text font-size="15" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="bold" fill="#245bdb" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="17.648"><tspan x="0" text-anchor="start">VLLM_PLUGINS = os.environ["VLLM_PLUGINS"].split(",") # 没有 strip</tspan></tspan></text></g>
<g id="a1:5" transform="translate(40, 154.3525)"><text font-size="15" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="bold" fill="#2ea121" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="17.648"><tspan x="0" text-anchor="start">[p.strip() for p in SGLANG_PLUGINS.split(",") if p.strip()]</tspan></tspan></text></g>
<g id="a1:6" transform="translate(40, 197.882)"><text font-size="12" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="bold" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="14.118"><tspan x="0" text-anchor="start">VLLM_PLUGINS 的值</tspan></tspan></text></g>
