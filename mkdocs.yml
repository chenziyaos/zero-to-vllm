# Online edition of book/, published to GitHub Pages by .github/workflows/pages.yml.
# Local preview: pip install -r docs-site/requirements.txt && mkdocs serve
site_name: 从 0 开始 vLLM
site_url: https://zyaochen.github.io/zero-to-vllm/
site_description: 按章拆 vLLM：显存账本、调度与抢占、Paged KV、前缀缓存、PD 分离、LoRA 与部署实战。
repo_url: https://github.com/zyaochen/zero-to-vllm
repo_name: zyaochen/zero-to-vllm
edit_uri: blob/main/book/
docs_dir: book
site_dir: site
copyright: <a href="https://zyaochen.github.io/">zyaochen</a> · MIT

theme:
  name: material
  custom_dir: docs-site/overrides
  language: zh
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.sections
    - navigation.path
    - navigation.footer
    - navigation.top
    - navigation.tracking
    - search.highlight
    - content.action.view
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle: { icon: material/weather-night, name: 切换到暗色 }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle: { icon: material/weather-sunny, name: 切换到亮色 }
  font: false
  icon:
    repo: fontawesome/brands/github

plugins:
  - search:
      # lunr.zh needs a server-side segmenter; split on every CJK character instead.
      lang: en
      separator: '[\s\u200b\-_,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])|(?<=[\u3400-\u9fff])|(?=[\u3400-\u9fff])'

hooks:
  - docs-site/hooks.py

markdown_extensions:
  - tables
  - attr_list
  - md_in_html
  - admonition
  - footnotes
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: math
          class: arithmatex
          format: !!python/object/apply:pymdownx.arithmatex.arithmatex_fenced_format {kwds: {mode: generic, tag: pre}}
  - pymdownx.arithmatex:
      generic: true
      inline_syntax: [round]
      block_syntax: [dollar, square]

extra:
  katex: false
  repo_prefix: "book"
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/zyaochen
