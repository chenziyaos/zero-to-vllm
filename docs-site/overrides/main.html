{% extends "base.html" %}

{% block extrahead %}
  {{ super() }}
  {% if config.extra.katex %}
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.19.1/dist/katex.min.css"
        integrity="sha384-WwGtaC6ywCHxA5cstpj/3+xIZvTez8dq2IcBQaXRkenHZ7FVVq1ZROtURwfbtTlG" crossorigin="anonymous">
  {% endif %}
{% endblock %}

{% block scripts %}
  {{ super() }}
  {% if config.extra.katex %}
  <script src="https://cdn.jsdelivr.net/npm/katex@0.19.1/dist/katex.min.js"
          integrity="sha384-a1WQdjRj162i159OYq041X6I4K8NenkrI09LlPmiHg0YOb7CR+wJOraXwK9abpnE" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.19.1/dist/contrib/auto-render.min.js"
          integrity="sha384-bjyGPfbij8/NDKJhSGZNP/khQVgtHUE5exjm4Ydllo42FwIgYsdLO2lXGmRBf5Mz" crossorigin="anonymous"></script>
  <script>
    document$.subscribe(function () {
      document.querySelectorAll(".arithmatex").forEach(function (el) {
        renderMathInElement(el, {
          delimiters: [
            { left: "\\(", right: "\\)", display: false },
            { left: "\\[", right: "\\]", display: true }
          ],
          throwOnError: false
        });
      });
    });
  </script>
  {% endif %}
{% endblock %}
